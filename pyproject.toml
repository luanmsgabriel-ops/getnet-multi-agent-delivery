[project]
name = "getnet-agents"
version = "3.0.0"
description = "Multi-agent support system for Getnet merchants (Router/Supervisor, Knowledge, Support, Escalation)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "tzdata>=2024.1",
    "anthropic>=2.9.0",
    "langgraph>=1.2.22",
    "httpx2>=2.16.2",
    "fastembed>=0.9.1",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=1.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
ingest = [
    "pypdf>=7.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S101", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"app/data/seed.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["llm: calls a real LLM provider (skipped unless ANTHROPIC_API_KEY is set)"]
