services:
  api:
    build: .
    image: getnet-agents:local
    env_file:
      - path: .env
        required: true
    environment:
      DATA_DIR: /state
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - getnet_state:/state
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

volumes:
  getnet_state:
