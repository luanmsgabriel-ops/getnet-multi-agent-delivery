services:
  atendimento:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GETNET_KNOWLEDGE: rag
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 768m
    cpus: 1.0
    restart: "no"
