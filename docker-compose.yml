x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp:size=64m,noexec,nosuid
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  restart: unless-stopped

services:
  api:
    <<: *hardened
    build: .
    image: getnet-agents:local
    env_file:
      - path: .env
        required: true
    environment:
      DATA_DIR: /state
      OPERATOR_WEBHOOK_URL: http://webhook-sink:9000/operator
      MERCHANT_WEBHOOK_URL: http://webhook-sink:9000/merchant
      # Set by `make obs` to export traces to Jaeger; empty means tracing off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # App state (conversations, handoffs, memory, ledger) and rate limits shared by replicas.
      STATE_DATABASE_URL: postgresql://getnet:${POSTGRES_PASSWORD:?run make setup}@postgres:5432/getnet
      REDIS_URL: redis://redis:6379/0
      # Tokens come from the OIDC provider and are checked against its JWKS (docs/adr/015);
      # local HS256 tokens are switched off here.
      OIDC_ISSUER: http://oidc:8080/getnet
      JWT_SECRET: ""
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - getnet_state:/state
    mem_limit: 2560m
    cpus: 2.0
    depends_on:
      webhook-sink:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      oidc:
        condition: service_started

  # Development identity provider (navikt/mock-oauth2-server, MIT). It issues signed RS256
  # tokens to any client that asks, so it is for local use only: in production OIDC_ISSUER
  # points at the company's identity provider. `make token` gets tokens from it.
  oidc:
    <<: *hardened
    image: ghcr.io/navikt/mock-oauth2-server:6.1.5
    environment:
      JSON_CONFIG_PATH: /config/oidc.json
      LOG_LEVEL: WARN
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    volumes:
      - ./ops/oidc/config.json:/config/oidc.json:ro
    mem_limit: 384m

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: getnet
      POSTGRES_DB: getnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make setup}
    volumes:
      - getnet_pg:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getnet -d getnet"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Start as the image's unprivileged redis user: with cap_drop ALL the entrypoint cannot
    # switch users itself. No persistence: counters are one-minute windows.
    user: "999:1000"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # Stands in for the operator's queue tool and the merchant app: logs signed notifications.
  webhook-sink:
    <<: *hardened
    image: getnet-agents:local
    command: ["python", "-m", "app.hitl.sink"]
    env_file:
      - path: .env
        required: true
    mem_limit: 128m
    healthcheck:
      disable: true

  # ---- observability (docker compose --profile obs up -d, or `make obs`) ----------------
  prometheus:
    profiles: [obs]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    profiles: [obs]
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/getnet-agents.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

  jaeger:
    profiles: [obs]
    image: jaegertracing/all-in-one:1.63.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]

volumes:
  getnet_pg:
  getnet_state:
