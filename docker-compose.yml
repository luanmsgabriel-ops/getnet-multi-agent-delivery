x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp:size=64m,noexec,nosuid
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  restart: unless-stopped

services:
  api:
    <<: *hardened
    build: .
    image: getnet-agents:local
    env_file:
      - path: .env
        required: true
    environment:
      DATA_DIR: /state
      OPERATOR_WEBHOOK_URL: http://webhook-sink:9000/operator
      MERCHANT_WEBHOOK_URL: http://webhook-sink:9000/merchant
      # Set by `make obs` to export traces to Jaeger; empty means tracing off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - getnet_state:/state
    mem_limit: 2560m
    cpus: 2.0
    depends_on: [webhook-sink]

  # Stands in for the operator's queue tool and the merchant app: logs signed notifications.
  webhook-sink:
    <<: *hardened
    image: getnet-agents:local
    command: ["python", "-m", "app.hitl.sink"]
    env_file:
      - path: .env
        required: true
    mem_limit: 128m
    healthcheck:
      disable: true

  # ---- observability (docker compose --profile obs up -d, or `make obs`) ----------------
  prometheus:
    profiles: [obs]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    profiles: [obs]
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/getnet-agents.json
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

  jaeger:
    profiles: [obs]
    image: jaegertracing/all-in-one:1.63.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]

volumes:
  getnet_state:
