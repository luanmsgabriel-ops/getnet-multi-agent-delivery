services:
  atendimento:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GETNET_KNOWLEDGE: rag
      GETNET_AUTH_MODE: required
      GETNET_AUTH_DB: /state/local/access.db
      GETNET_CONTEXT_DB: /state/local/state.db
      GETNET_DEMO_TICKET_DB: /state/local/tickets.db
      GETNET_DEMO_TICKETS: "0"
      GETNET_ORCHESTRATION: deterministic
      GETNET_CONTEXT_MODEL: "0"
      GETNET_ALLOW_MODEL_NETWORK: "0"
      GETNET_RAG_GENERATION: disabled
      GETNET_RAG_RETRIEVAL: lexical
      GETNET_PUBLIC_SEARCH: disabled
      GETNET_WEB_SEARCH: "0"
    volumes:
      - getnet_state:/state
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 768m
    cpus: 1.0
    restart: "no"
volumes:
  getnet_state:
