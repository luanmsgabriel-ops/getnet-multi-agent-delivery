name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (offline, full suite)
        run: uv run pytest

  state-backends:
    # App state in Postgres, rate limits in Redis and OIDC tokens, against real services
    # (docs/adr/014, docs/adr/015).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: getnet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
      oidc:
        image: ghcr.io/navikt/mock-oauth2-server:6.1.5
        ports: ["8080:8080"]
        env:
          # same as ops/oidc/config.json
          JSON_CONFIG: '{"interactiveLogin":false,"tokenCallbacks":[{"issuerId":"getnet","tokenExpiry":3600,"requestMappings":[{"requestParam":"grant_type","match":"client_credentials","claims":{"sub":"${clientId}","aud":["getnet-chat"],"scope":"${scope}","tenant":"demo"}}]}]}'
    env:
      TEST_POSTGRES_URL: postgresql://test:test@127.0.0.1:5432/getnet
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      TEST_OIDC_ISSUER: http://127.0.0.1:8080/getnet
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: Postgres, Redis and OIDC integration tests
        run: uv run pytest -rA tests/integration/test_state_backends.py tests/integration/test_oidc_live.py

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag getnet-agents:ci .
      - name: Smoke test (hardened container)
        run: |
          docker run -d --name api -p 8000:8000 --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m --tmpfs /state:rw,size=64m,uid=10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e JWT_SECRET="$(openssl rand -hex 32)" getnet-agents:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/chat \
            -H 'Content-Type: application/json' -d '{"message":"hi","user_id":"cliente1988"}')" = 401
          TOKEN=$(docker exec api python -m app.security.tokens issue --sub cliente1988)
          test "$(curl -s http://127.0.0.1:8000/me -H "Authorization: Bearer $TOKEN" | python3 -c 'import json,sys;print(json.load(sys.stdin)["sub"])')" = cliente1988
      - name: Container logs
        if: always()
        run: docker logs api || true
      - name: Image scan (critical, fixable)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.0 \
            image --scanners vuln --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress \
            getnet-agents:ci

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Dependency vulnerabilities (pip-audit)
        run: |
          uv export --frozen --no-dev --no-hashes > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt
      - name: Static analysis (bandit, medium and above)
        run: uvx bandit -r app -q -ll
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner
      - name: Alert rules (promtool check + unit tests)
        run: |
          PROMTOOL="docker run --rm --entrypoint promtool -v $PWD/ops/prometheus:/p -w /p prom/prometheus:v2.55.1"
          $PROMTOOL check rules alerts.yml
          $PROMTOOL test rules alerts_test.yml
